<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Lovely VPN Demo</title>
<style>
:root {
  --bg: #f3f6fb;
  --surface: #ffffff;
  --surface-2: #f7f9fc;
  --border: #e6ebf2;
  --text: #0f172a;
  --text-2: #5b6474;
  --text-3: #94a0b2;
  --brand-1: #06b6d4;
  --brand-2: #2563eb;
  --brand: #2563eb;
  --ok: #16a34a;
  --ok-soft: #dcfce7;
  --warn: #f59e0b;
  --danger: #dc2626;
  --danger-soft: #fef2f2;
  --danger-border: #fecaca;
  --hero-1: #e0f2fe;
  --hero-2: #eef2ff;
  --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 4px 16px rgba(15, 23, 42, .06);
  --ring-idle: #cbd5e1;
  --focus: rgba(37, 99, 235, .35);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f141f;
    --surface: #171e2c;
    --surface-2: #1c2433;
    --border: #263042;
    --text: #e8edf5;
    --text-2: #9aa6b8;
    --text-3: #657186;
    --brand: #60a5fa;
    --ok: #22c55e;
    --ok-soft: rgba(34, 197, 94, .14);
    --danger: #f87171;
    --danger-soft: rgba(248, 113, 113, .1);
    --danger-border: rgba(248, 113, 113, .3);
    --hero-1: #0f2a3a;
    --hero-2: #1a1f3d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    --ring-idle: #334155;
    --focus: rgba(96, 165, 250, .4);
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
  font-size: 13px;
  color: var(--text);
  background: var(--bg);
  user-select: none;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
input, textarea { font: inherit; color: inherit; user-select: text; }
svg { display: block; }

/* ---------- 标题栏 ---------- */
.titlebar {
  position: absolute; inset: 0 0 auto 0; height: 40px; z-index: 20;
  display: flex; align-items: center;
}
.titlebar .drag { flex: 1; height: 100%; display: flex; align-items: center; gap: 8px; padding-left: 14px; }
.titlebar .logo { width: 18px; height: 18px; }
.titlebar .name { font-size: 12.5px; font-weight: 600; color: var(--text-2); letter-spacing: .2px; }
.wbtn {
  width: 46px; height: 40px; display: grid; place-items: center;
  color: var(--text-2); transition: background .12s, color .12s;
}
.wbtn:hover { background: rgba(127, 127, 127, .14); color: var(--text); }
.wbtn.close:hover { background: #e81123; color: #fff; }
.wbtn svg { width: 10px; height: 10px; }

/* ---------- 视图容器 ---------- */
.view {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  transition: transform .32s cubic-bezier(.2, .8, .2, 1), opacity .25s;
}
#settings { transform: translateX(100%); background: var(--bg); z-index: 10; }
body.show-settings #settings { transform: none; }
body.show-settings #home { transform: translateX(-24%); opacity: 0; }

/* ---------- 主页 ---------- */
.hero {
  position: relative; padding: 56px 24px 20px; text-align: center;
  background:
    radial-gradient(120% 80% at 50% 0%, var(--hero-1) 0%, transparent 70%),
    radial-gradient(80% 60% at 100% 30%, var(--hero-2) 0%, transparent 70%);
}

.power {
  --size: 128px;
  position: relative; width: var(--size); height: var(--size); margin: 0 auto;
  border-radius: 50%; display: grid; place-items: center;
  background: var(--surface);
  box-shadow: 0 10px 30px rgba(15, 23, 42, .10), inset 0 0 0 1px var(--border);
  transition: transform .2s, box-shadow .3s, background .3s;
  outline: none;
}
.power:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(15, 23, 42, .14), inset 0 0 0 1px var(--border); }
.power:active { transform: scale(.97); }
.power:focus-visible { box-shadow: 0 0 0 4px var(--focus); }
.power .icon { width: 46px; height: 46px; color: var(--text-3); transition: color .3s; }
.power .ring {
  position: absolute; inset: -9px; border-radius: 50%;
  border: 3px solid var(--ring-idle); opacity: .6; transition: border-color .3s, opacity .3s;
}
.power .spin {
  position: absolute; inset: -9px; border-radius: 50%; opacity: 0;
  background: conic-gradient(from 0deg, transparent 0 60%, var(--warn) 100%);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
          mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
  transition: opacity .2s;
}
.power .pulse { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; }

[data-state="busy"] .power .icon { color: var(--warn); }
[data-state="busy"] .power .ring { opacity: .25; border-color: var(--warn); }
[data-state="busy"] .power .spin { opacity: 1; animation: spin 1s linear infinite; }

[data-state="connected"] .power {
  background: linear-gradient(145deg, #22c55e, #059669);
  box-shadow: 0 12px 32px rgba(22, 163, 74, .35);
}
[data-state="connected"] .power .icon { color: #fff; }
[data-state="connected"] .power .ring { border-color: #22c55e; opacity: .35; }
[data-state="connected"] .power .pulse { animation: pulse 2.4s ease-out infinite; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, .45); }
  100% { box-shadow: 0 0 0 28px rgba(34, 197, 94, 0); }
}

.status { margin-top: 22px; font-size: 21px; font-weight: 700; letter-spacing: .5px; }
.substatus { margin-top: 6px; min-height: 18px; color: var(--text-2); font-size: 12.5px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 12px;
  padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 500;
  background: var(--surface); color: var(--text-2); box-shadow: inset 0 0 0 1px var(--border);
}
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
[data-state="busy"] .pill .dot { background: var(--warn); animation: blink 1s infinite; }
[data-state="connected"] .pill { background: var(--ok-soft); color: var(--ok); box-shadow: none; }
[data-state="connected"] .pill .dot { background: var(--ok); }
@keyframes blink { 50% { opacity: .3; } }

.content { flex: 1; padding: 0 20px; overflow-y: auto; }

.alert {
  display: none; gap: 10px; align-items: flex-start;
  margin-bottom: 12px; padding: 10px 12px; border-radius: 10px;
  background: var(--danger-soft); border: 1px solid var(--danger-border); color: var(--danger);
  font-size: 12.5px; line-height: 1.5; user-select: text; animation: rise .25s ease-out;
}
.alert.show { display: flex; }
.alert svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
.alert .msg { flex: 1; word-break: break-all; }
.alert .x { opacity: .6; padding: 0 2px; } .alert .x:hover { opacity: 1; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

.card {
  background: var(--surface); border-radius: 14px; box-shadow: var(--shadow);
  border: 1px solid var(--border); overflow: hidden;
}
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.row + .row { border-top: 1px solid var(--border); }
.row .ico {
  width: 30px; height: 30px; border-radius: 8px; flex: none; display: grid; place-items: center;
  background: var(--surface-2); color: var(--brand);
}
.row .ico svg { width: 16px; height: 16px; }
.row .label { color: var(--text-2); font-size: 12.5px; }
.row .value {
  margin-left: auto; font-weight: 600; max-width: 190px; text-align: right;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: text;
}
.row .value.muted { color: var(--text-3); font-weight: 400; }
.row .value.mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.login-note { margin: 12px 2px 0; color: var(--text-2); font-size: 12px; line-height: 1.6; }

/* ---------- 登录页 ---------- */
#login { z-index: 15; background: var(--bg); }
body:not(.need-login) #login { display: none; }
.login-hero {
  padding: 68px 24px 22px; text-align: center;
  background:
    radial-gradient(120% 80% at 50% 0%, var(--hero-1) 0%, transparent 70%),
    radial-gradient(80% 60% at 100% 30%, var(--hero-2) 0%, transparent 70%);
}
.login-logo { width: 52px; height: 52px; margin: 0 auto 14px; }
.login-title { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
.login-sub { margin-top: 6px; color: var(--text-2); font-size: 12.5px; }
.login-form { padding: 0 20px; }
.login-foot { padding: 12px 14px 14px; }
.login-err { min-height: 18px; margin-bottom: 6px; color: var(--danger); font-size: 12px; line-height: 1.5; }
.login-btn { width: 100%; }
.login-btn:disabled { opacity: .75; cursor: default; }
.login-hint { margin-top: 12px; color: var(--text-3); font-size: 11.5px; line-height: 1.7; text-align: center; }

.footer {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px 14px 10px;
}
.link {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 8px;
  color: var(--text-2); font-weight: 500; transition: background .12s, color .12s;
}
.link:hover { background: rgba(127, 127, 127, .12); color: var(--text); }
.link svg { width: 16px; height: 16px; }
.version { color: var(--text-3); font-size: 11.5px; }
.nav-link { display: none; color: var(--brand); margin-left: auto; margin-right: 6px; }
.nav-link:hover { color: var(--brand); }
[data-state="connected"] .nav-link { display: inline-flex; }

/* ---------- 设置页 ---------- */
.sheader { display: flex; align-items: center; gap: 4px; padding: 48px 16px 8px 10px; }
.back { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: var(--text-2); }
.back:hover { background: rgba(127, 127, 127, .12); color: var(--text); }
.back svg { width: 18px; height: 18px; }
.sheader h1 { font-size: 18px; font-weight: 700; }

.sbody { flex: 1; overflow-y: auto; padding: 6px 20px 12px; }
.sbody::-webkit-scrollbar { width: 6px; }
.sbody::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.notice {
  display: none; margin-bottom: 12px; padding: 10px 12px; border-radius: 10px; font-size: 12.5px; line-height: 1.5;
  background: var(--hero-1); color: var(--brand);
}
.notice.show { display: block; }
.section { margin-bottom: 16px; }
.section h2 { font-size: 12px; font-weight: 600; color: var(--text-3); letter-spacing: .5px; margin: 0 2px 8px; }
.field { padding: 12px 14px; }
.field + .field { border-top: 1px solid var(--border); }
.field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 7px; }
.field input, .field textarea {
  width: 100%; padding: 8px 10px; border-radius: 8px; outline: none;
  background: var(--surface-2); border: 1px solid var(--border);
  transition: border-color .15s, box-shadow .15s, background .15s;
}
.field textarea { resize: none; height: 64px; font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; line-height: 1.5; }
.field input:focus, .field textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus); background: var(--surface); }
.field .hint { margin-top: 6px; color: var(--text-3); font-size: 11.5px; line-height: 1.5; }
.field.invalid input { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(220, 38, 38, .15); }

.sfooter {
  display: flex; align-items: center; gap: 10px; padding: 12px 20px 18px;
  border-top: 1px solid var(--border); background: var(--bg);
}
.btn {
  height: 36px; padding: 0 18px; border-radius: 9px; font-weight: 600;
  transition: filter .12s, background .12s, transform .1s;
}
.btn:active { transform: scale(.98); }
.btn.primary {
  margin-left: auto; color: #fff; min-width: 96px;
  background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
  box-shadow: 0 4px 12px rgba(37, 99, 235, .3);
}
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { color: var(--text-2); }
.btn.ghost:hover { background: rgba(127, 127, 127, .12); color: var(--text); }
.serr { color: var(--danger); font-size: 12px; flex: 1; text-align: right; }

.toast {
  position: absolute; left: 50%; bottom: 76px; z-index: 30;
  transform: translate(-50%, 10px); opacity: 0; pointer-events: none;
  display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px;
  background: #0f172a; color: #fff; font-size: 12.5px; box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
  transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast svg { width: 14px; height: 14px; color: #4ade80; }
.wbtn { display: none; }
</style>
</head>

<div class="titlebar">
  <div class="drag" id="drag">
    <svg class="logo" viewBox="0 0 24 24">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs>

</div>

<!-- 主页 -->
<section class="view" id="home">
  <div class="hero">
    <button class="power" id="power" aria-label="连接">
      <span class="ring"></span><span class="spin"></span><span class="pulse"></span>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">

</section>

<!-- 登录页 -->

      </div>

  </div>
</section>

<!-- 设置页 -->
<section class="view" id="settings">
  <div class="sheader">
    <button class="back" id="btnBack" title="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1>设置</h1>
  </div>

  <div class="sbody">
    <div class="notice" id="notice"></div>

    <div class="section">
      <h2>网络代理</h2>
      <div class="card">
        <div class="field" id="fProxy">
          <label for="proxy">演示标签（不会改变网络）</label>

      </div>
    </div>
  </div>

  <div class="sfooter">
    <button class="btn ghost" id="btnClear">清空</button>
    <span class="serr" id="saveErr"></span>
    <button class="btn primary" id="btnSave">保存</button>
  </div>
</section>

<div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg><span id="toastMsg"></span></div>

<script src="/demo-bridge.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const send = (cmd, extra) => window.demoSend(cmd, extra);

  let st = { state: 'idle' };
  let timer = null;

  // ---- 窗口控制 ----
  $('drag').addEventListener('mousedown', e => { if (e.button === 0) send('drag'); });
  $('btnMin').onclick = () => send('minimize');
  $('btnClose').onclick = () => send('close');
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('show-settings')) closeSettings(); });

  // ---- 登录页 ----
  $('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    if ($('btnLogin').disabled) return;
    $('loginErr').textContent = '';
    $('btnLogin').disabled = true;
    $('btnLogin').textContent = '正在登录…';
    send('login', { jobId: $('jobId').value.trim(), password: $('pwd').value });
  });
  $('jobId').addEventListener('input', () => { $('jobId').value = $('jobId').value.replace(/\D/g, ''); });

  // ---- 主页 ----
  $('power').onclick = () => send('toggle');
  $('alertClose').onclick = () => $('alert').classList.remove('show');
  $('btnSettings').onclick = () => openSettings();
  $('btnNav').onclick = () => send('nav');

  const fmtDur = ms => {
    const s = Math.max(0, Math.floor(ms / 1000));
    const p = n => String(n).padStart(2, '0');
    return `${p(Math.floor(s / 3600))}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}`;
  };
  const setValue = (id, text, muted) => { const el = $(id); el.textContent = text; el.classList.toggle('muted', !!muted); el.title = muted ? '' : text; };

  function render() {
    document.body.dataset.state = st.state;
    $('status').textContent = { idle: '未连接', busy: st.status || '正在连接…', connected: '已连接' }[st.state];
    $('substatus').textContent = {
      idle: '点击按钮开始合成连接演示',
      busy: '点击按钮可取消',
      connected: '模拟连接成功，未建立真实隧道',
    }[st.state];
    $('pillText').textContent = { idle: '离线', busy: '连接中', connected: '在线' }[st.state];
    $('power').setAttribute('aria-label', { idle: '连接', busy: '取消', connected: '断开' }[st.state]);

    if (st.state === 'connected') {
      setValue('vUser', st.user || st.uin);
    } else {
      setValue('vUser', '未登录', true);
    }
    if (st.ip) setValue('vIP', st.ip); else setValue('vIP', '未分配', true);
    setValue('vNet', st.network || '直连');

    if (st.error) { $('alertMsg').textContent = st.error; $('alert').classList.add('show'); }
    else if (st.state !== 'idle') $('alert').classList.remove('show');

    clearInterval(timer);
    const tick = () => setValue('vTime', st.state === 'connected' ? fmtDur(Date.now() - st.since) : '--:--:--', st.state !== 'connected');
    tick();
    if (st.state === 'connected') timer = setInterval(tick, 1000);
  }

  // ---- 设置页 ----
  function openSettings(notice) {
    $('proxy').value = (st.config && st.config.proxy) || '';
    $('saveErr').textContent = '';
    $('fProxy').classList.remove('invalid');
    $('notice').textContent = notice || (st.state === 'connected' ? '当前已连接，修改将在下次连接时生效。' : '');
    $('notice').classList.toggle('show', !!$('notice').textContent);
    document.body.classList.add('show-settings');
    setTimeout(() => $('proxy').focus(), 320);
  }
  function closeSettings() { document.body.classList.remove('show-settings'); }

  $('btnBack').onclick = closeSettings;
  $('btnClear').onclick = () => { $('proxy').value = ''; $('fProxy').classList.remove('invalid'); $('proxy').focus(); };
  $('btnSave').onclick = () => { $('saveErr').textContent = ''; send('save', { config: { proxy: $('proxy').value.trim() } }); };
  $('proxy').addEventListener('input', () => $('fProxy').classList.remove('invalid'));
  $('proxy').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnSave').click(); });

  let toastTimer;
  function toast(msg) {
    $('toastMsg').textContent = msg;
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1800);
  }

  // ---- 供 Go 调用 ----
  window.ui = {
    init(p) {
      $('version').textContent = 'v' + p.version;
      $('appName').textContent = p.appName;
      $('loginAppName').textContent = p.appName;
      document.title = p.appName;
    },
    state(s) { st = s; render(); },
    loginResult(r) {
      $('btnLogin').disabled = false;
      $('btnLogin').textContent = '登 录';
      if (r.ok) {
        document.body.classList.remove('need-login');
        toast('欢迎您，' + r.name);
        return;
      }
      $('loginErr').textContent = r.error;
      $('pwd').focus();
    },
    openSettings(msg) { openSettings(msg); },
    saved(r) {
      if (!r.ok) {
        $('saveErr').textContent = r.error;
        $('fProxy').classList.add('invalid');
        return;
      }
      closeSettings();
      toast('设置已保存');
    },
  };
  send('ready');
})();
</script>
</body>
</html>
