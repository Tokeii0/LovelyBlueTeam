services:
  vpn:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        TARGET: ./vpn
    ports:
      - "127.0.0.1:8801:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  uds-portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        TARGET: ./uds-agent/cmd/portal
    ports:
      - "127.0.0.1:8802:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
