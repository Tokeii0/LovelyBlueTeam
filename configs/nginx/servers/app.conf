server {
    listen 127.0.0.1:18080;
    server_name app.example.com;
    access_log logs/access.log bt_access;

    # Return-only rewrite guards also cover existing ^~ proxy locations.
    if ($bt_denied) { return 403; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Request-ID $request_id always;
    location / {
        proxy_pass http://example_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite untrusted client-supplied forwarding headers at the edge.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
