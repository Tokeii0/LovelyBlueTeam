# Default: no query strings, cookies, Authorization, User-Agent or body.
# Even paths and source addresses can be sensitive: this is data minimization,
# not anonymization. Apply access controls and a retention policy to these logs.
log_format bt_access escape=json
    '{"time":"$time_iso8601","ip":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration":"$request_time",'
    '"upstream":"$upstream_status","request_id":"$request_id"}';

# Optional forensic body format; never enabled by the default server.
# The request body may be absent when buffered to disk. An empty field is not
# proof that the original request had no content.
log_format bt_post escape=json
    '{"time":"$time_iso8601","ip":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"content_type":"$content_type","body":"$request_body",'
    '"upstream":"$upstream_status","duration":"$request_time",'
    '"request_id":"$request_id"}';
map $request_method $bt_is_post { default 0; POST 1; }
