# Normalized URI checks. Upload paths are examples; adapt them to actual routing.
map $uri $bt_uri_denied {
    default 0;
    "~*(^|/)[.](git|svn|hg)(/|$)" 1;
    "~*(^|/)[.]env($|[./])" 1;
    "~*^/actuator/(env|heapdump)(/|$)" 1;
    "~*^/(uploads|files)(/|;).*[.](jsp|jspx|jspf|php|phtml|asp|aspx)([;/]|$)" 1;
}
# Exclude the query string before inspecting the original encoded path.
map $request_uri $bt_original_path {
    "~^(?<bt_path_only>[^?]*)" $bt_path_only;
    default "";
}
map $bt_original_path $bt_path_denied {
    default 0;
    "~*(^|/)([.]|%2e){1,2}(;|%3b)" 1;
    "~*%(25)+(2e|2f|3b|5c)" 1;
}
map "$bt_uri_denied:$bt_path_denied" $bt_denied {
    default 1;
    "0:0" 0;
}
