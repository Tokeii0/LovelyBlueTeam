# Standalone loopback example. Keep this separate from business reverse proxies.
worker_processes 1;
error_log logs/error.log crit;
pid logs/nginx.pid;
events { worker_connections 128; }
http {
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    client_body_temp_path temp/client_body;
    proxy_temp_path temp/proxy;

    map $uri $honey_route {
        default other;
        / landing;
        /login login;
        /logout logout;
        /portal documents;
        /client vpn_demo;
        /resources resources;
        /healthz health;
        /api/login login_api;
        /api/connect connect_demo;
        /api/auth/token demo_session;
        ~^/docs/ documents;
    }
    map $request_method $honey_method {
        default OTHER;
        GET GET;
        HEAD HEAD;
        POST POST;
        OPTIONS OPTIONS;
    }
    log_format honey escape=json '{"time":"$time_iso8601","source":"honeypot.nginx",'
        '"site":"$server_name","route":"$honey_route","method":"$honey_method",'
        '"status":$status,"duration_s":$request_time}';
    access_log logs/honeypots.jsonl honey;

    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";

    server {
        listen 127.0.0.1:8811;
        server_name vpn.example.invalid;
        location / { proxy_pass http://127.0.0.1:8801; }
    }
    server {
        listen 127.0.0.1:8812;
        server_name uds.example.invalid;
        location / { proxy_pass http://127.0.0.1:8802; }
    }
}
