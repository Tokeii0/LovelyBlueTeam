name: Source validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: apps/lovelylog/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/verify.py
      - run: python -m pip install -r tests/openresty/requirements.txt
      - run: python tests/openresty/verify_upload_guard.py
      - run: python tests/openresty/verify_query_guard.py
      - run: python scripts/release_scan.py
  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - run: python scripts/test_nginx.py --nginx /usr/sbin/nginx
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: python scripts/test_honeypots.py --nginx /usr/sbin/nginx
